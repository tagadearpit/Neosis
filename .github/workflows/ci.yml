name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neosis-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neosis-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: neosis-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
