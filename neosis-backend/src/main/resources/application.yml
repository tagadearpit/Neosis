server:
  port: 8080
  forward-headers-strategy: framework 
  servlet:
    session:
      cookie:
        same-site: none 
        secure: true 

app:
  frontend:
    url: ${FRONTEND_URL:https://neosis-static-site.onrender.com}

spring:
  application:
    name: neosis-backend
  
  # CRITICAL FIX: MongoDB Connection String
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/neosis}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile