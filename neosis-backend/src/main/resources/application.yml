server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:24h}
      cookie:
        name: NEOSIS_SESSION
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: ${SESSION_TIMEOUT:24h}

app:
  frontend:
    url: ${FRONTEND_URL:https://neosis-static-site.onrender.com}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL:https://neosis-static-site.onrender.com}}

spring:
  application:
    name: neosis-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/neosis}
      auto-index-creation: true
  session:
    timeout: ${SESSION_TIMEOUT:24h}
    mongodb:
      collection-name: neosis_sessions
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"
  level:
    root: INFO
    org.springframework.security: WARN
