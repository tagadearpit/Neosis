server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript
  servlet:
    session:
      timeout: 30d
      cookie:
        name: NEOSIS_SESSION
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: 30d

app:
  frontend:
    url: ${FRONTEND_URL:https://neosis-static-site.onrender.com}

spring:
  application:
    name: neosis-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/neosis}
      auto-index-creation: true
  session:
    timeout: 30d
    mongodb:
      collection-name: neosis_sessions
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: WARN
