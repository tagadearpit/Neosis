server:
  port: 8080
  forward-headers-strategy: framework # CRITICAL: Forces Tomcat to read Render's HTTPS proxy
  servlet:
    session:
      cookie:
        # CRITICAL FIX: Removed inner quotes to prevent Spring parsing errors
        same-site: ${SESSION_COOKIE_SAME_SITE:none} 
        secure: ${SESSION_COOKIE_SECURE:true}

# Custom property for dynamic frontend routing
app:
  frontend:
    url: ${FRONTEND_URL:https://neosis-static-site.onrender.com}

spring:
  application:
    name: neosis-backend
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    open-in-view: false 
    hibernate:
      # NOTE: Change to 'validate' once you go live in production to prevent accidental data loss
      ddl-auto: update 
    show-sql: true    
    properties:
      hibernate:
        format_sql: true

  # Google OAuth 2.0 Security Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile